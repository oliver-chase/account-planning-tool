<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Planning Tool</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/accounts.css">
<link rel="stylesheet" href="css/local.css">
<script src="js/xlsx.full.min.js"></script>
</head>
<body>
<a class="skip-link" href="#account-content">Skip to the account</a>

<aside class="app-sidebar" id="sidebar" aria-label="Account tools">
  <div class="app-sidebar-logo">
    <div class="app-sidebar-brand">Account planning</div>
  </div>
  <div class="app-sidebar-section">
    <div class="app-sidebar-section-label">Sections</div>
    <nav id="section-nav" aria-label="Sections"></nav>
  </div>
  <div class="app-sidebar-section">
    <div class="app-sidebar-section-label">Actions</div>
    <div id="file-actions-bar"></div>
  </div>
</aside>

<div class="app show-hamburger">
  <div class="topbar">
    <button type="button" class="topbar-hamburger" id="btn-hamburger" aria-label="Toggle menu">&#9776;</button>
    <div class="topbar-search" role="search">
      <input type="text" class="module-filter-search" id="global-filter-search" placeholder="Search people &amp; actions&hellip;" aria-label="Search people and actions">
      <button type="button" class="module-filter-reset" id="global-filter-reset" title="Clear search and view filters">Reset</button>
    </div>
    <div class="module-topbar-right">
      <span class="module-sync-indicator" role="status" aria-live="polite">
        <span class="module-sync-dot" id="sync-dot"></span>
        <span id="sync-text">No file loaded</span>
      </span>
      <input type="file" id="file-input" accept=".xlsx" hidden>
    </div>
  </div>

  <main class="main">
    <h1 class="visually-hidden">Account Planning Tool</h1>
    <div id="account-content" tabindex="-1">

      <div id="help-banner-slot"></div>
      <div id="start-slot"></div>

      <div class="account-header-row">
        <div>
          <div id="account-name-heading" class="account-name-heading" contentEditable role="textbox" aria-label="Account name" data-placeholder="Account Name" title="Click to edit short account name"></div>
          <div id="account-client-company" class="account-client-company" contentEditable role="textbox" aria-label="Company name" data-placeholder="Company Name" title="Click to edit full client name"></div>
          <div class="page-last-updated" id="page-last-updated"></div>
        </div>
        <div class="account-header-actions">
          <div class="account-header-tier-group">
            <span class="card-meta-label">Account Tier</span>
            <div id="account-tier-slot"></div>
          </div>
        </div>
      </div>

      <div id="overview" class="section">
        <div class="app-section-header"><div class="app-section-title" role="heading" aria-level="2">Plan</div></div>
        <div id="overview-body"></div>
      </div>

      <div id="people" class="section">
        <div id="people-body"></div>
      </div>

      <div id="actions" class="section">
        <div id="actions-body-wrap"></div>
      </div>

      <div id="notes" class="section">
        <div id="notes-body-wrap"></div>
      </div>

    </div>
  </main>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div class="app-toast-container" id="toast-container" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="js/state.js"></script>
<script src="js/excel.js"></script>
<script src="js/help.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/pickers.js"></script>
<script src="js/plan.js"></script>
<script src="js/overview.js"></script>
<script src="js/orgchart.js"></script>
<script src="js/people.js"></script>
<script src="js/actions.js"></script>
<script src="js/notes.js"></script>
<script src="js/filterbar.js"></script>
<script src="js/brand.js"></script>
<script src="js/export.js"></script>
<script src="js/call-summary.js"></script>
<script src="js/orgchart-export.js"></script>
<script src="js/start.js"></script>
<script src="js/app.js"></script>
<script src="js/app-shell.js"></script>
</body>
</html>
